db_url: "postgres://foundry:foundry@localhost:5432/foundry?sslmode=disable"
cerberus_bin: "cerberus"
cerberus_image: ""
cerberus_model: ""
server_port: 8080
# Development only: permits unauthenticated telemetry from loopback clients.
# Set telemetry_bearer_token (or FOUNDRY_TELEMETRY_BEARER_TOKEN) for remote producers.
telemetry_allow_unauthenticated: true
ui_verbosity: "normal"
max_concurrent_workflows: 1
default_workflow_budget_usd: 0.5
default_phase_timeout_seconds: 1800
git_root: "~/git"

cerberus_profile: ""

# Steward plan review (Plan 90): engineering contract, model, and timeout
# for one bounded Steward review turn. review_contract_path is required
# for reviews to run; review_contract_appendix_path is optional.
review_contract_path: ""
review_contract_appendix_path: ""
review_contract_version: "v1"
review_model: "anthropic/claude-sonnet-5"
review_timeout_seconds: 900
